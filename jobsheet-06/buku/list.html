<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Buku | SIMPUS-Mini</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body><header class="site-header">
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand" href="../index.html">SIMPUS-Mini</a>
    <button type="button" id="nav-toggle-btn" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <nav class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto gap-lg-1"><li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li><li class="nav-item"><a class="nav-link active" href="../buku/list.html">Daftar Buku</a></li><li class="nav-item"><a class="nav-link" href="../buku/tambah.html">Tambah Buku</a></li><li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li></ul></nav>
  </div>
</nav>
</header>
<main class="page-main">
  <section class="panel">
    <h1 class="panel-title">Daftar Buku</h1>
    <div class="toolbar">
      <div class="search-form">
        <label class="visually-hidden" for="search-input">Cari Judul Buku</label>
        <input type="search" class="form-control" id="search-input" placeholder="Ketik judul buku...">
        <button class="btn btn-success" type="button" id="search-button">⌕ Cari</button>
      </div>
      <a class="btn btn-success" href="tambah.html">+ Tambah Buku</a>
    </div>
    <p id="loading-indicator" class="loading-message" role="status" aria-live="polite">Memuat data...</p>
    <p id="table-counter" class="small text-secondary mb-3">Menyiapkan data...</p>
    <div class="table-wrap">
      <table class="table table-hover align-middle" id="dataTable" data-kind="buku">
        <thead><tr><th scope="col">Judul</th><th scope="col">Pengarang</th><th scope="col">Tahun</th><th scope="col">Stok</th><th scope="col">Aksi</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<script src="../assets/js/buku.js"></script>
<script>
document.getElementById('search-button').addEventListener('click', () => document.getElementById('search-input').dispatchEvent(new Event('input')));
</script>
