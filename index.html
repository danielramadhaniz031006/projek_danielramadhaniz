<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projek Daniel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Selamat Datang</h1>
    <p>Halaman ini dimuat dari index.html</p>
    <div id="app"></div>
  </div>

  <script>
    // Opsional: Mengambil data dari backend PHP di folder api
    fetch('/api/index.php')
      .then(res => res.text())
      .then(data => {
        document.getElementById('app').innerHTML = data;
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
