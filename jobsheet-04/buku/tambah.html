<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tambah Buku | SIMPUS-Mini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body><header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto gap-lg-1"><li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li><li class="nav-item"><a class="nav-link" href="../buku/list.html">Daftar Buku</a></li><li class="nav-item"><a class="nav-link active" aria-current="page" href="../buku/tambah.html">Tambah Buku</a></li><li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li><li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li></ul>
            </div>
        </div>
    </nav>
</header>
<main class="page-main">
    <section class="panel form-panel">
        <h1 class="panel-title">Tambah Buku</h1>
        <form onsubmit="event.preventDefault(); alert('Form ini masih berupa tampilan Jobsheet 4. Hubungkan ke backend untuk menyimpan data.');">
            <div class="form-row">
            <label for="judul" class="form-label">Judul</label>
            <input class="form-control" type="text" id="judul" name="judul" placeholder="Masukkan judul buku"  required>
        </div><div class="form-row">
            <label for="pengarang" class="form-label">Pengarang</label>
            <input class="form-control" type="text" id="pengarang" name="pengarang" placeholder="Masukkan nama pengarang"  required>
        </div><div class="form-row">
            <label for="tahun" class="form-label">Tahun Terbit</label>
            <input class="form-control" type="number" id="tahun" name="tahun" placeholder="Contoh: 2026" min="1900" max="2026" required>
        </div><div class="form-row">
            <label for="isbn" class="form-label">ISBN</label>
            <input class="form-control" type="text" id="isbn" name="isbn" placeholder="Contoh: 978-623-1234-56-7"  >
        </div><div class="form-row">
            <label for="stok" class="form-label">Stok</label>
            <input class="form-control" type="number" id="stok" name="stok" placeholder="Contoh: 5" min="0" required>
        </div>
            <div class="form-row">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" name="kategori" class="form-select">
                <option value="fiksi">Fiksi</option>
                <option value="non-fiksi">Non-Fiksi</option>
                <option value="referensi">Referensi</option>
            </select>
        </div>
            <div class="form-actions">
                <button class="btn btn-success" type="submit">▣ Simpan</button>
                <button class="btn btn-reset" type="reset">↻ Reset</button>
            </div>
        </form>
    </section>
</main>
<footer class="site-footer">
    <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
