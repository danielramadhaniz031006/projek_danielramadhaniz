</head>
<body><header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto gap-lg-1"><li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li><li class="nav-item"><a class="nav-link" href="../buku/list.html">Daftar Buku</a></li><li class="nav-item"><a class="nav-link" href="../buku/tambah.html">Tambah Buku</a></li><li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li><li class="nav-item"><a class="nav-link active" aria-current="page" href="../anggota/tambah.html">Tambah Anggota</a></li></ul>
            </div>
        </div>
    </nav>
</header>
<main class="page-main">
    <section class="panel form-panel">
        <h1 class="panel-title">Tambah Anggota</h1>
        <form onsubmit="event.preventDefault(); alert('Form ini masih berupa tampilan Jobsheet 4. Hubungkan ke backend untuk menyimpan data.');">
            <div class="form-row">
            <label for="nama" class="form-label">Nama</label>
            <input class="form-control" type="text" id="nama" name="nama" placeholder="Masukkan nama anggota"  required>
        </div><div class="form-row">
            <label for="no_anggota" class="form-label">No. Anggota</label>
            <input class="form-control" type="text" id="no_anggota" name="no_anggota" placeholder="Contoh: A001"  required>
        </div><div class="form-row">
            <label for="alamat" class="form-label">Alamat</label>
            <input class="form-control" type="text" id="alamat" name="alamat" placeholder="Masukkan alamat"  >
        </div><div class="form-row">
            <label for="no_hp" class="form-label">No. HP</label>
            <input class="form-control" type="tel" id="no_hp" name="no_hp" placeholder="Contoh: 081234567890"  >
        </div>
            
            <div class="form-actions">
                <button class="btn btn-success" type="submit">▣ Simpan</button>
                <button class="btn btn-reset" type="reset">↻ Reset</button>
            </div>
        </form>
    </section>
</main>
